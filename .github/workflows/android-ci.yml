name: FERENGINE Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: C++20 core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reconstruct source package
        run: bash tools/unpack-source.sh "$RUNNER_TEMP/ferengine-source"
      - name: Configure core
        run: cmake -S "$RUNNER_TEMP/ferengine-source/FerEngine" -B "$RUNNER_TEMP/ferengine-source/FerEngine/build" -G Ninja -DFERENGINE_BUILD_TESTS=ON
      - name: Build core
        run: cmake --build "$RUNNER_TEMP/ferengine-source/FerEngine/build" --parallel
      - name: Run tests
        run: ctest --test-dir "$RUNNER_TEMP/ferengine-source/FerEngine/build" --output-on-failure

  android-debug:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Reconstruct source package
        run: bash tools/unpack-source.sh "$RUNNER_TEMP/ferengine-source"
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"
      - name: Build debug APK
        run: gradle --no-daemon -p "$RUNNER_TEMP/ferengine-source/FerEngine/platform/android" assembleDebug
      - name: Validate APK
        shell: bash
        run: |
          APK="$RUNNER_TEMP/ferengine-source/FerEngine/platform/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.ferstudio.ferengine.debug'"
          sha256sum "$APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ferengine-debug-${{ github.sha }}
          path: ${{ runner.temp }}/ferengine-source/FerEngine/platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
